<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Банк задач ЕГЭ{% endblock %}</title>
  <meta name="description" content="Задачи открытого банка ФИПИ по профильной математике, разложенные по номерам ЕГЭ, с решениями и печатью в PDF.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171a'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3E%D0%A4%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='katex/katex.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='katex/katex.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='katex/contrib/auto-render.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body data-admin="{{ '1' if admin else '0' }}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">Ф</span>
      <span>
        <strong>Банк задач ЕГЭ</strong>
        <small>профильная математика · 2027</small>
      </span>
    </a>
    {% if admin %}<span class="chip warning topbar-mode">редактор</span>{% endif %}
  </header>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    Условия задач — <a href="https://ege.fipi.ru/bank/" rel="noopener">открытый банк заданий ФИПИ</a>.
    Разметка по номерам и решения — неофициальные, возможны ошибки.
  </footer>
</body>
</html>
